<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Essential Assignment Tracker - Add New Assignment</title>

    <link rel="stylesheet" href="css/add-Assignment.css">
    <link rel="stylesheet" href="css/shared-nav.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Nunito+Sans:wght@400;500;600&display=swap">
    <script src="js/toast.js"></script>
    <script src="js/shared-nav.js" defer></script>
    <script src="js/time-display.js" defer></script>
</head>
<body>

<!-- Toast messages appear here after save/update actions. -->

<div id="toastContainer" style="position:fixed;z-index:9999;pointer-events:none;"></div>

<!-- Top header with title, time, dark mode, and nav links -->
<div class="header">
    <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
        <h1 style="margin: 0; font-size: 1.5rem; color: #f2e7f4; display: flex; align-items: center;">🎓 Essential Assignment Tracker
            <button id="darkModeToggle" aria-label="Toggle dark mode" style="background:none;border:none;cursor:pointer;margin-left:12px;vertical-align:middle;outline:none;position:relative;">
                <span id="darkModeIcon" style="display:inline-block;width:42px;height:42px;vertical-align:middle;">
                    <img id="sunIcon" src="Icons/day.png" alt="Light mode" width="42" height="42" style="display:block;object-fit:contain;" loading="lazy" decoding="async">
                    <img id="moonIcon" src="Icons/night.png" alt="Dark mode" width="42" height="42" style="display:none;object-fit:contain;" loading="lazy" decoding="async">
                </span>
            </button>
        </h1>
        <div id="timeDisplay" style="margin-right:50px;"></div>
        <div class="nav" data-shared-nav></div>
    </div>
</div>

<!-- Main add-assignment section -->

<div class="content">
    <h2>Add New Assignment</h2>

    <!-- Form used to add or edit an assignment -->
     
    <form id="assignmentForm">
        <table class="form-table">
            <tr>
                <td class="label">Assignment Name:</td>
                <td class="input">
                    <input type="text" name="Assignment_name" placeholder="e.g. Assignment 1" required />
                </td>
            </tr>
            <tr>
                <td class="label">Module / Course:</td>
                <td class="input">
                    <input type="text" name="module" list="moduleSuggestions" placeholder="e.g. COM101 / Mathematics 202" required />
                    <datalist id="moduleSuggestions"></datalist>
                </td>
            </tr>
            <tr>
                <td class="label">Due Date:</td>
                <td class="input">
                    <div id="calendarContainer"></div>
                    <input type="hidden" name="due_date" id="dueDateInput" required />
                </td>
            </tr>
            <tr>
                <td class="label">Priority:</td>
                <td class="input">
                    <select name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td class="label">Status:</td>
                <td class="input">
                    <select name="status" id="statusSelect">
                        <option value="Active">Active</option>
                        <option value="Due soon">Due Soon</option>
                        <option value="Overdue">Overdue</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <div id="statusPreview" class="status-preview status-Active">Active</div>
                </td>
            </tr>
            <tr>
                <td class="label">Notes / Description:</td>
                <td class="input">
                    <textarea name="notes" placeholder="Any extra details, requirements, links..."></textarea>
                </td>
            </tr>
        </table>

        <button type="submit" class="save-btn">Save Assignment</button>
        <audio id="saveSound" src="ui-save.wav" preload="auto"></audio>
        <audio id="updateSound" src="ui-update.wav" preload="auto"></audio>
    </form>
    <script src="js/button-sounds.js"></script>
        <script src="js/calendar.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        const saveBtn = document.querySelector('.save-btn');
        const saveSound = document.getElementById('saveSound');
        const updateSound = document.getElementById('updateSound');
        saveBtn.addEventListener('click', function(e) {
            const soundEnabled = typeof window.isAppSoundEnabled === 'function'
                ? window.isAppSoundEnabled()
                : localStorage.getItem('soundEnabled') !== '0';
            if (!soundEnabled) return;
            // Play update sound if editing, otherwise play save sound
            if (saveBtn.textContent.trim().toLowerCase().includes('update')) {
                updateSound.currentTime = 0;
                updateSound.play();
            } else {
                saveSound.currentTime = 0;
                saveSound.play();
            }
        });
            // Load saved assignments so dots appear on the calendar
            let assignments = [];
            try {
                assignments = JSON.parse(localStorage.getItem('assignments')) || [];
            } catch {}
            // Start with today, or use the current assignment due date in edit mode
            let initialDate = new Date();
            const editIdx = (function() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.has('edit') ? urlParams.get('edit') : null;
            })();
            if (editIdx !== null && assignments[parseInt(editIdx)]) {
                let d = new Date(assignments[parseInt(editIdx)].due);
                if (!isNaN(d)) initialDate = d;
            }
            function toLocalIsoDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            function formatDisplayDue(date) {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }
            // Keep the hidden due date input synced with the calendar
            function setDueDate(date) {
                document.getElementById('dueDateInput').value = toLocalIsoDate(date);
            }
            function renderAssignmentCalendar() {
                renderCalendar(assignments, initialDate, function(date) {
                    setDueDate(date);
                }, 'month', function(date, dayAssignments) {
                    if (Array.isArray(dayAssignments) && dayAssignments.length > 0) {
                        const firstMatch = dayAssignments[0];
                        if (firstMatch && typeof firstMatch.index === 'number') {
                            window.location.href = `add-Assignment.html?edit=${firstMatch.index}`;
                            return;
                        }
                    }

                    if (editIdx === null) return;

                    const assignmentIndex = parseInt(editIdx, 10);
                    if (!assignments[assignmentIndex]) return;

                    assignments[assignmentIndex].due = formatDisplayDue(date);
                    localStorage.setItem('assignments', JSON.stringify(assignments));
                    setDueDate(date);

                    if (typeof window.showNotification === 'function') {
                        window.showNotification('Due date updated. Click Update Assignment to save other edits.', { icon: 'check', duration: 2600 });
                    }
                });
            }
            function refreshAddAssignmentView() {
                try {
                    assignments = JSON.parse(localStorage.getItem('assignments')) || [];
                } catch {
                    assignments = [];
                }

                if (typeof populateModuleSuggestions === 'function') {
                    populateModuleSuggestions();
                }

                if (editIdx !== null && assignments[parseInt(editIdx)]) {
                    const currentAssignment = assignments[parseInt(editIdx)];
                    document.querySelector('input[name="Assignment_name"]').value = currentAssignment.name;
                    document.querySelector('input[name="module"]').value = currentAssignment.module;

                    let dateObj = new Date(currentAssignment.due);
                    if (!isNaN(dateObj)) {
                        initialDate = dateObj;
                        setDueDate(dateObj);
                    }
                    document.querySelector('select[name="status"]').value = currentAssignment.status;
                    document.querySelector('textarea[name="notes"]').value = currentAssignment.notes || '';
                    document.querySelector('.save-btn').textContent = 'Update Assignment';
                }

                renderAssignmentCalendar();
            }
            setDueDate(initialDate);
            renderAssignmentCalendar();
            window.addEventListener('assignments-updated', refreshAddAssignmentView);
    });
    </script>

    <script>
        
// Update the status preview badge when status changes.

document.getElementById('statusSelect').addEventListener('change', function(e) {
    const val = e.target.value;
    const preview = document.getElementById('statusPreview');
    preview.textContent = val;

    // Use a color class that matches the selected status.

    let statusClass = 'status-preview ';
    if (val === 'Active') statusClass += 'status-Active';
    else if (val === 'Due soon') statusClass += 'status-due';
    else if (val === 'Overdue') statusClass += 'status-overdue';
    else if (val === 'Completed') statusClass += 'status-done';
    else statusClass += 'status-Active';
    preview.className = statusClass;
});

// Fill module suggestions from previously saved assignments.

function populateModuleSuggestions() {

    let assignments = [];
    try {
        assignments = JSON.parse(localStorage.getItem('assignments')) || [];
    } catch {}

    const moduleList = document.getElementById('moduleSuggestions');
    if (!moduleList) return;

    const modules = [...new Set(
        assignments
            .map(a => (a.module || '').trim())
            .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    moduleList.innerHTML = '';
    modules.forEach(moduleName => {
        const option = document.createElement('option');
        option.value = moduleName;
        moduleList.appendChild(option);
    });
}

populateModuleSuggestions();

function getQueryParam(param) {

    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.has(param) ? urlParams.get(param) : null;
}

function toLocalIsoDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

const editIdx = getQueryParam('edit');
if (editIdx !== null) {

    // If there is an edit index in the URL, load that assignment into the form.

    let assignments = [];
    try {
        assignments = JSON.parse(localStorage.getItem('assignments')) || [];
    } catch {}
    const assignment = assignments[parseInt(editIdx)];
    if (assignment) {
        document.querySelector('input[name="Assignment_name"]').value = assignment.name;
        document.querySelector('input[name="module"]').value = assignment.module;

        // Convert saved due date into the input's YYYY-MM-DD format.

        let dateObj = new Date(assignment.due);
        if (!isNaN(dateObj)) {
            document.querySelector('input[name="due_date"]').value = toLocalIsoDate(dateObj);
        }
        document.querySelector('select[name="status"]').value = assignment.status;
        document.querySelector('textarea[name="notes"]').value = assignment.notes || '';

        // Show that this form submit will update instead of create.

        document.querySelector('.save-btn').textContent = 'Update Assignment';
    }
}

document.getElementById('assignmentForm').addEventListener('submit', function(e) {

    e.preventDefault(); // Keep the page from reloading so JS can save data.

        // Ask the user to confirm save/update before continuing.

        const confirmMsg = editIdx !== null
            ? 'Are you sure you want to update this assignment?\n\nPlease review your changes before saving.'
            : 'Are you sure you want to add this assignment?\n\nPlease review your details before saving.';
        if (!window.confirm(confirmMsg)) {
                // Stop if user cancels.
                return;
        }

    const form = e.target;

    // Read form values.

    const name = form.Assignment_name.value.trim();
    const module = form.module.value.trim();
    const dueParts = String(form.due_date.value || '').split('-');
    const due = dueParts.length === 3
        ? new Date(Number(dueParts[0]), Number(dueParts[1]) - 1, Number(dueParts[2]))
        : new Date(form.due_date.value);
    const displayDue = due.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const status = form.status.value;
    const notes = form.notes.value.trim();
    let assignments = [];
    try {
        assignments = JSON.parse(localStorage.getItem('assignments')) || [];
    } catch {}
    if (editIdx !== null && assignments[parseInt(editIdx)]) {
        
        // Replace existing assignment.
        
        assignments[parseInt(editIdx)] = { name, Assignment_name: name, module, due: displayDue, status, notes };

    } else {
        // Add a new assignment.

        assignments.push({ name, Assignment_name: name, module, due: displayDue, status, notes });
    }
    // Save to localStorage so data stays after refresh.

    localStorage.setItem('assignments', JSON.stringify(assignments));

    // Set message type for dashboard toast after redirect.
    if (editIdx !== null) {
        sessionStorage.setItem('assignmentStatus', 'updated');
    } else {
        sessionStorage.setItem('assignmentStatus', 'saved');
    }
    // Return to dashboard after save/update.
    setTimeout(function() {
        window.location.href = 'dashboard.html';
    }, 600);
});
    </script>
</div>

</body>
</html>
