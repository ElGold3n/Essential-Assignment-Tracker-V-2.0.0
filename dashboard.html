<!-- Dashboard page: view, filter, edit, and delete assignments. -->
<!-- Styling is from dashboard.css and shared-nav.css. -->
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/shared-nav.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&family=Nunito+Sans:wght@400;500;600&display=swap">
<script src="js/toast.js"></script>
<script src="js/shared-nav.js" defer></script>
<script src="js/time-display.js" defer></script>

<!-- Loader overlay styles -->
<style>
#loaderOverlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.08);
    backdrop-filter: blur(8px);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    z-index:9999;
}
#loaderOverlay.active {
    opacity:1;
    pointer-events:all;
}

/* Keep loader visible before full page reveal */
html.preload-transition-pending .header,
html.preload-transition-pending .content {
    opacity: 1;
    filter: none;
    transform: none;
}

html.preload-transition-pending #loaderOverlay {
    opacity: 1;
    pointer-events: all;
}

html.preload-transition-pending body {
    overflow: hidden;
}

.spinner {
    width:44px;
    height:44px;
    border:3px solid rgba(255,255,255,0.22);
    border-top:3px solid rgba(255,255,255,0.82);
    border-radius:50%;
    box-shadow: 0 0 18px rgba(255,255,255,0.16);
    animation: spin 1s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
if (localStorage.getItem("loadingTransition") === "true") {
    document.documentElement.classList.add("preload-transition-pending");
}
</script>

</head>

<body>
    <!-- Loader overlay -->
    <div id="loaderOverlay">
            <div class="spinner"></div>
    </div>

<!-- Toast messages appear here -->

<div id="toastContainer" style="position:fixed;z-index:9999;pointer-events:none;"></div>

<!-- Top header -->

<div class="header" style="display:flex;align-items:center;justify-content:space-between;">
    <h1 style="flex:1;">🎓 Essential Assignment Tracker

        <!-- Dark mode toggle -->

                <img id="moonIcon" src="Icons/night.png" alt="Dark mode" width="42" height="42" style="display:none;object-fit:contain;" loading="lazy" decoding="async">

<!-- Main content -->

<div class="content">
    
    <!-- Summary cards -->

    <div class="stats" id="stats">

        <!-- Cards rendered by JS -->
    </div>
    <h2>Upcoming Assignments</h2>

    <!-- Search and filters -->
     
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search Assignments..." />

        <select id="statusFilter">
            <option value="">Status ▼</option>

    <!-- Assignments table -->

    <table>

            <th>Actions</th>

        </thead>

            <!-- Rows rendered by JS -->
        </tbody>
    </table>

    <!-- Add and delete controls -->

        <div style="display: flex; gap: 12px; margin-top: 25px;">
                <a href="add-Assignment.html" class="add-btn" id="addAssignmentBtn">+ Add New Assignment</a>
                <button id="deleteAssignmentBtn" class="add-btn" style="background:#dc3545;" disabled>🗑️ Delete Assignment</button>
                <audio id="deleteSound" src="FX/ui-delete.wav" preload="auto"></audio>
        </div>
    <style>
        .smoke-effect {
                position: absolute;
                pointer-events: none;
                border-radius: 50%;
                filter: blur(16px);
                opacity: 0.45;
                z-index: 1000;
                transition: opacity 0.5s;
                will-change: transform, opacity;
        }
    </style>
        <script>

        // Hover smoke effect for Add/Delete buttons.

        function addSmokeEffect(btn, color) {
            let smoke = null;
            let fadeTimeout = null;
            btn.addEventListener('mouseenter', e => {
                if (!smoke) {
                    smoke = document.createElement('div');
                    smoke.className = 'smoke-effect';
                    smoke.style.background = color;
                    smoke.style.width = '60px';
                    smoke.style.height = '60px';
                    smoke.style.opacity = '0.45';
                    smoke.style.pointerEvents = 'none';
                    smoke.style.position = 'absolute';
                    smoke.style.zIndex = '1000';
                    document.body.appendChild(smoke);
                }
                smoke.style.display = 'block';
                smoke.style.opacity = '0.45';
            });
            btn.addEventListener('mousemove', e => {
                if (!smoke) return;

                // Move smoke with the mouse over the button.

                const rect = btn.getBoundingClientRect();

                // Keep smoke inside button bounds.

                let x = e.clientX - 30;
                let y = e.clientY - 30;

                // Clamp to edge if cursor leaves button area.
                
                if (e.clientX < rect.left) x = rect.left;
                if (e.clientX > rect.right) x = rect.right - 60;
                if (e.clientY < rect.top) y = rect.top;
                if (e.clientY > rect.bottom) y = rect.bottom - 60;
                smoke.style.left = (x + window.scrollX) + 'px';
                smoke.style.top = (y + window.scrollY) + 'px';
                smoke.style.opacity = '0.45';
                smoke.style.transition = 'opacity 0.1s';
                if (fadeTimeout) clearTimeout(fadeTimeout);
            });
            btn.addEventListener('mouseleave', e => {
                if (smoke) {
                    smoke.style.transition = 'opacity 0.5s';
                    smoke.style.opacity = '0';
                    fadeTimeout = setTimeout(() => { if (smoke) smoke.style.display = 'none'; }, 500);
                }
            });
        }
        window.addEventListener('DOMContentLoaded', function() {
            const addBtn = document.getElementById('addAssignmentBtn');
            const delBtn = document.getElementById('deleteAssignmentBtn');
            if (addBtn) addSmokeEffect(addBtn, 'radial-gradient(circle at 50% 50%, #28a745 0%, #38b6ff 100%)');
            if (delBtn) addSmokeEffect(delBtn, 'radial-gradient(circle at 50% 50%, #b411cf 0%, #dc3545 100%)');
        });
        </script>
        <script src="js/button-sounds.js"></script>
        <script>
        window.addEventListener('DOMContentLoaded', function() {
            setupButtonSound(document.getElementById('deleteAssignmentBtn'), 'FX/ui-delete.wav');
        });
        </script>

<script>
// Show loader when entering from the welcome page transition.
window.addEventListener("load", () => {
    const loader = document.getElementById("loaderOverlay");
    const fromTransition = localStorage.getItem("loadingTransition") === "true";
    const syncRaw = localStorage.getItem("enterSoundSync");
    const soundEnabled = localStorage.getItem("soundEnabled") !== "0";
    let loaderHoldMs = 600;

    // Resume entry sound if it was already playing.
    if (syncRaw && soundEnabled) {
        try {
            const sync = JSON.parse(syncRaw);
            const startedAt = Number(sync.startedAt) || Date.now();
            const durationMs = Number(sync.durationMs) || 6000;
            const elapsedMs = Date.now() - startedAt;
            const remainingMs = Math.max(0, durationMs - elapsedMs);
            loaderHoldMs = Math.max(loaderHoldMs, remainingMs);

            if (remainingMs > 0) {
                const resumedAudio = new Audio(sync.src || "FX/Ui-tap.wav");
                resumedAudio.preload = "auto";
                const resumeSec = Math.max(0, elapsedMs / 1000);
                const maxSec = Math.max(0, durationMs / 1000 - 0.05);
                resumedAudio.currentTime = Math.min(resumeSec, maxSec);
                const playResult = resumedAudio.play();
                if (playResult && typeof playResult.catch === "function") {
                    playResult.catch(() => {});
                }
            }
        } catch (err) {
            localStorage.removeItem("enterSoundSync");
        }
    }

    if (fromTransition) {
        loader.classList.add("active");
        localStorage.removeItem("loadingTransition");

        setTimeout(() => {
            loader.classList.remove("active");
            document.documentElement.classList.remove("preload-transition-pending");
            localStorage.removeItem("enterSoundSync");
        }, loaderHoldMs);
    } else {
        document.documentElement.classList.remove("preload-transition-pending");
    }
});
// Date helpers and assignment loading.

function parseDueDate(value) {
    if (!value) return null;

    const raw = String(value).trim();
    let parts = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (parts) {
        return new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
    }

    parts = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (parts) {
        return new Date(Number(parts[3]), Number(parts[2]) - 1, Number(parts[1]));
    }

    const parsed = new Date(raw);
    if (isNaN(parsed)) return null;
    return new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
}

function toLocalIsoDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function toDisplayDueDate(date) {
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function getAssignments() {

    // Load assignments from localStorage.

    const data = localStorage.getItem('assignments');
    let arr = data ? JSON.parse(data) : [];

    // Auto-update status based on due date.

    const today = new Date();
    today.setHours(0,0,0,0);
    const DUE_SOON_DAYS = 3;
    arr = arr.map(a => {
        const dueDate = parseDueDate(a.due);
        if (a.status !== 'Completed' && a.due) {
            if (dueDate) dueDate.setHours(0,0,0,0);
            if (!dueDate) return a;

            const daysLeft = Math.round((dueDate - today) / 86400000);
            if (daysLeft < 0) {
                a.status = 'Overdue';
            } else if (daysLeft <= DUE_SOON_DAYS) {
                a.status = 'Due soon';
            } else if (a.status === 'Overdue' || a.status === 'Due soon') {
                a.status = 'Active';
            }
        } else if (a.due) {
            if (dueDate) dueDate.setHours(0,0,0,0);
        }
        return a;
    });
    return arr;
}

// Save assignments to localStorage.

function saveAssignments(arr) {
    localStorage.setItem('assignments', JSON.stringify(arr));
}

function populateModuleFilter(assignments) {
    const moduleFilter = document.getElementById('moduleFilter');
    if (!moduleFilter) return;

    const selected = moduleFilter.value;
    const modules = [...new Set(
        assignments
            .map(a => (a.module || '').trim())
            .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    moduleFilter.innerHTML = '<option value="">Module ▼</option>';
    modules.forEach(moduleName => {
        const option = document.createElement('option');
        option.value = moduleName;
        option.textContent = moduleName;
        moduleFilter.appendChild(option);
    });

    if (selected && modules.includes(selected)) {
        moduleFilter.value = selected;
    }
}

// Render summary stats.

function renderStats(assignments) {
    let completed = 0, overdue = 0, dueToday = 0, thisWeek = 0;
    const today = new Date();
    today.setHours(0,0,0,0);
    assignments.forEach(a => {
        const dueDate = parseDueDate(a.due);
        if (dueDate) {
            dueDate.setHours(0,0,0,0);
        }
        if (a.status === "Completed") completed++;
        else if (a.status === "Overdue") overdue++;
        if (dueDate && dueDate.toDateString() === today.toDateString()) dueToday++;

        // Count items due this week.

        if (dueDate) {
            const weekStart = new Date(today);
            weekStart.setHours(0,0,0,0);
            const weekEnd = new Date(today);
            weekEnd.setDate(today.getDate() + (7 - today.getDay() - 1)); // Sunday
            weekEnd.setHours(23,59,59,999);
            if (dueDate >= weekStart && dueDate <= weekEnd) thisWeek++;
        }
    });
    function getStatCircle(val, color) {
        if (val === 0) {
            return `<svg width="70" height="70" style="visibility:hidden"><circle cx="35" cy="35" r="32" stroke="${color}" stroke-width="6" fill="none" /></svg>`;
        } else {
            return `<svg width="70" height="70"><circle cx="35" cy="35" r="32" stroke="${color}" stroke-width="6" fill="none" class="stat-anim" /></svg>`;
        }
    }
    document.getElementById('stats').innerHTML = `
        <div class="card">
            <h3>Due Today</h3>
            <div class="stat-circle">
                ${getStatCircle(dueToday, '#fd7e14')}
                <span class="number due-soon">${dueToday}</span>
            </div>
        </div>
        <div class="card">
            <h3>Overdue</h3>
            <div class="stat-circle">
                ${getStatCircle(overdue, '#dc3545')}
                <span class="number overdue">${overdue}</span>
            </div>
        </div>
        <div class="card">
            <h3>This Week</h3>
            <div class="stat-circle">
                ${getStatCircle(thisWeek, '#0385b8')}
                <span class="number active">${thisWeek}</span>
            </div>
        </div>
        <div class="card">
            <h3>Completed</h3>
            <div class="stat-circle">
                ${getStatCircle(completed, '#28a745')}
                <span class="number completed">${completed}</span>
            </div>
        </div>
    `;
}

// Render assignments table with status and actions.

function renderAssignments(assignments) {

    // Target table body.

    const table = document.getElementById('assignmentTable');
    table.innerHTML = '';

    // Map status value to CSS class.

    function getStatusClass(status) {
        switch (status) {
            case 'Completed': return 'status-Completed';
            case 'Overdue': return 'status-overdue';
            case 'Due soon': return 'status-due';
            case 'Active': return 'status-active';
            case 'Done': return 'status-done';
            case 'Normal': return 'status-normal';
            default: return 'status-normal';
        }
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatNotesHtml(notes) {
        const noteText = String(notes || '');
        if (!noteText.trim()) return '';

        return `<div class="notes-inline"><strong>Note:</strong><div class="notes-inline-first">${escapeHtml(noteText)}</div></div>`;
    }

    function getRemainingDaysMeta(dueDate, status) {
        if (!dueDate) return { text: 'No due date', color: '#6c757d' };

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const normalizedDue = new Date(dueDate.getFullYear(), dueDate.getMonth(), dueDate.getDate());
        const daysLeft = Math.round((normalizedDue - today) / 86400000);

        if (status === 'Completed') {
            if (daysLeft < 0) {
                const pastDays = Math.abs(daysLeft);
                return {
                    text: pastDays === 1 ? 'Completed 1 day ago' : `Completed ${pastDays} days ago`,
                    color: '#28a745'
                };
            }

            if (daysLeft === 0) {
                return { text: 'Completed today', color: '#28a745' };
            }

            return {
                text: daysLeft === 1 ? 'Completed 1 day early' : `Completed ${daysLeft} days early`,
                color: '#28a745'
            };
        }

        if (daysLeft < 0) {
            const overdueDays = Math.abs(daysLeft);
            return {
                text: overdueDays === 1 ? '1 day overdue' : `${overdueDays} days overdue`,
                color: '#dc3545'
            };
        }

        if (daysLeft === 0) {
            return { text: 'Due today', color: '#fd7e14' };
        }

        if (daysLeft <= 3) {
            return {
                text: daysLeft === 1 ? '1 day left' : `${daysLeft} days left`,
                color: '#fd7e14'
            };
        }

        return {
            text: daysLeft === 1 ? '1 day left' : `${daysLeft} days left`,
            color: '#0385b8'
        };
    }

    // Build each row.

    assignments.forEach((a, idx) => {
        let dateValue = '';
        const parsedDate = parseDueDate(a.due);
        if (parsedDate) {
            dateValue = toLocalIsoDate(parsedDate);
        }
        const remainingMeta = getRemainingDaysMeta(parsedDate, a.status);
        const statusClass = getStatusClass(a.status);

        // Pick date input tint by status.

        let dateBg = '';
        switch (a.status) {
            case 'Completed': dateBg = '#28a74522'; break; // green tint
            case 'Overdue': dateBg = '#dc354522'; break; // red tint
            case 'Due soon': dateBg = '#fd7e1422'; break; // orange tint
            case 'Active': dateBg = '#0385b822'; break; // blue tint
            default: dateBg = '#f8f9fa'; // fallback
        }
                // Decorative stars for completed items.

                const completedStars = a.status === 'Completed' ? `
                    <span class="star-sparkle" style="margin-left:6px;vertical-align:middle;">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:relative;top:2px;z-index:2;">
                            <g>
                                <polygon points="11,2 13,8 19,8.5 14,12.5 15.5,19 11,15.5 6.5,19 8,12.5 3,8.5 9,8" fill="#FFD700" stroke="#FFC300" stroke-width="1.2"/>
                                <polygon points="11,5 12,8 15,8.2 12.5,10.2 13.5,13 11,11.2 8.5,13 9.5,10.2 7,8.2 10,8" fill="#FFF9C4" opacity="0.7"/>
                            </g>
                        </svg>
                        <span class="star-sparkle-outer" style="left:28px;top:-12px;">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="7,1 8,5 12,5.3 9,8 10,13 7,10.5 4,13 5,8 2,5.3 6,5" fill="#FFD700" stroke="#FFC300" stroke-width="0.7"/>
                            </svg>
                        </span>
                        <span class="star-sparkle-outer2" style="left:-18px;top:10px;">
                            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="5,1 6,4 9,4.2 7,6 8,9 5,7.5 2,9 3,6 1,4.2 4,4" fill="#FFD700" stroke="#FFC300" stroke-width="0.5"/>
                            </svg>
                        </span>
                        <span class="star-sparkle-outer3" style="left:18px;top:22px;">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="6,1 7,4 11,4.2 8,7 9,11 6,9.5 3,11 4,7 1,4.2 5,4" fill="#FFD700" stroke="#FFC300" stroke-width="0.6"/>
                            </svg>
                        </span>
                        <span class="star-sparkle-outer4" style="left:-28px;top:-8px;">
                            <svg width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="4.5,1 5,3 8,3.2 6,5 7,8 4.5,6.5 2,8 3,5 1,3.2 4,3" fill="#FFD700" stroke="#FFC300" stroke-width="0.4"/>
                            </svg>
                        </span>
                    </span>
                ` : '';
        table.innerHTML += `
            <tr class="assignment-row" data-idx="${idx}" tabindex="0" style="cursor:pointer;">
                <td>
                  ${a.name}
                                    ${a.notes ? formatNotesHtml(a.notes) : ''}
                  <button class="action-btn edit-btn" onclick="editAssignment(${idx});event.stopPropagation();" style="margin-top:4px;">Edit</button>
                </td>
                <td>${a.module}</td>
                <td>
                    <span>${a.due}</span><br>
                    <small style="display:block;margin-top:2px;color:${remainingMeta.color};font-weight:600;">${remainingMeta.text}</small>
                    <input type="date" value="${dateValue}" onchange="changeDueDate(${idx}, this.value);event.stopPropagation();" style="margin-top:4px; background:${dateBg}; border-radius:6px;" />
                </td>
                <td><span class="status ${statusClass}">${a.status}${completedStars}</span></td>
                <td>
                    <select class="action-dropdown" onchange="updateStatus(${idx}, this.value);event.stopPropagation();">
                        <option value="Active" ${a.status === 'Active' ? 'selected' : ''}>Active</option>
                        <option value="Due soon" ${a.status === 'Due soon' ? 'selected' : ''}>Due Soon</option>
                        <option value="Completed" ${a.status === 'Completed' ? 'selected' : ''}>Completed</option>
                        <option value="Overdue" ${a.status === 'Overdue' ? 'selected' : ''}>Overdue</option>
                    </select>
                </td>
            </tr>
        `;
    });
}

// Open add-assignment page in edit mode.

function editAssignment(idx) {
    window.location.href = `add-Assignment.html?edit=${idx}`;
}

// Change due date from table date picker.

function changeDueDate(idx, newDate) {

    // Read assignments.

    let assignments = getAssignments();

    // Convert date for display format.

    const dateObj = parseDueDate(newDate);
    if (!dateObj) {
        showNotification('Invalid date selected.', { duration: 2200 });
        return;
    }
    const displayDate = toDisplayDueDate(dateObj);
    assignments[idx].due = displayDate;
    saveAssignments(assignments);
    assignments = getAssignments(); // refresh status rules
    populateModuleFilter(assignments);
    renderStats(assignments);
    renderAssignments(assignments);
    showNotification('Assignment due date updated!', { icon: 'check' });
}

// Update status from the dropdown.

function updateStatus(idx, status) {

    // Update one status, then rerender.

    let assignments = getAssignments();
    assignments[idx].status = status;
    saveAssignments(assignments);
    assignments = getAssignments(); // refresh status rules
    populateModuleFilter(assignments);
    renderStats(assignments);
    renderAssignments(assignments);
    showNotification('Assignment status updated!', { icon: 'check' });
}

// Apply search and selected filters.

function filterAssignments() {

    // Read current filter values.

    const search = document.getElementById('searchInput').value.toLowerCase();
    const module = document.getElementById('moduleFilter').value;
    const status = document.getElementById('statusFilter').value;
    let assignments = getAssignments();

    // Keep rows matching search, module, and status.

    assignments = assignments.filter(a => {
        const matchesSearch = a.name.toLowerCase().includes(search);
        const matchesModule = !module || a.module === module;
        const matchesStatus = !status || a.status === status;
        return matchesSearch && matchesModule && matchesStatus;
    });
    renderStats(assignments);
    renderAssignments(assignments);
}

function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('moduleFilter').value = '';
    document.getElementById('statusFilter').value = '';
    filterAssignments();
}

document.getElementById('searchInput').addEventListener('input', filterAssignments);
document.getElementById('moduleFilter').addEventListener('change', filterAssignments);
document.getElementById('statusFilter').addEventListener('change', filterAssignments);
document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);

// First page render.

const assignments = getAssignments();
populateModuleFilter(assignments);
renderStats(assignments);
renderAssignments(assignments);

function refreshDashboardFromStorage() {
    const latestAssignments = getAssignments();
    populateModuleFilter(latestAssignments);
    renderStats(latestAssignments);
    renderAssignments(latestAssignments);
}

window.addEventListener('assignments-updated', refreshDashboardFromStorage);

// Show save/update toast after redirect.

const assignmentStatus = sessionStorage.getItem('assignmentStatus');
if (assignmentStatus === 'saved') {
    showNotification('Assignment saved!', { icon: 'check' });
    sessionStorage.removeItem('assignmentStatus');
} else if (assignmentStatus === 'updated') {
    showNotification('Assignment updated!', { icon: 'check' });
    sessionStorage.removeItem('assignmentStatus');
}

// Delete selected assignment after confirmation.

let selectedAssignmentIdx = null;
const assignmentTable = document.getElementById('assignmentTable');
const deleteBtn = document.getElementById('deleteAssignmentBtn');

function clearRowSelection() {
    document.querySelectorAll('.assignment-row.selected').forEach(row => row.classList.remove('selected'));
    selectedAssignmentIdx = null;
    if (deleteBtn) deleteBtn.disabled = true;
}

assignmentTable.addEventListener('click', function(e) {
    let row = e.target.closest('.assignment-row');
    if (!row) return;
    clearRowSelection();
    row.classList.add('selected');
    selectedAssignmentIdx = parseInt(row.getAttribute('data-idx'));
    if (deleteBtn) deleteBtn.disabled = false;
});

if (deleteBtn) {
    deleteBtn.addEventListener('click', function() {
        if (selectedAssignmentIdx === null) return;
        let assignments = getAssignments();
        if (assignments[selectedAssignmentIdx]) {
            if (confirm('Are you sure you want to delete this assignment?')) {
                assignments.splice(selectedAssignmentIdx, 1);
                saveAssignments(assignments);
                assignments = getAssignments(); // refresh status rules
                populateModuleFilter(assignments);
                renderStats(assignments);
                renderAssignments(assignments);
                clearRowSelection();
                showNotification('Assignment deleted!', { icon: 'check' });
            }
        }
    });
}
</script>
</body>
</html>
