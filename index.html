<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essential Assignment Tracker</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }

/* Background */
body {
    height: 100vh;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2a3c);
    background-size: 400% 400%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
    animation: gradientShift 15s ease infinite;
}

/* Transition out */
body.transitioning {
  opacity: 0;
  transform: scale(1.028);
  filter: blur(5px);
  transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1), transform 1s cubic-bezier(0.22, 1, 0.36, 1), filter 1s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes gradientShift {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

/* Floating items */
.floating-items {
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

.floating-item {
    position:absolute;
    opacity:0.15;
    font-size:26px;
    animation: rotateScale 20s infinite ease-in-out alternate;
}

.floating-item.left { left:5%; }
.floating-item.right { right:5%; }

@keyframes floatDown {
    0% { top:-10%; }
    100% { top:100%; }
}

@keyframes floatUp {
    0% { top:110%; }
    100% { top:-10%; }
}

@keyframes rotateScale {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.05); }
    100% { transform: rotate(-5deg) scale(1); }
}

/* Container */
.container {
    backdrop-filter: blur(25px);
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    padding: 50px 35px;
    width: 90%;
    max-width: 400px;
    text-align:center;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}

.hidden { display:none; }

/* Text animations */
@keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(25px); }
    to { opacity:1; transform:translateY(0); }
}

.app-title { animation: fadeSlideUp 0.8s ease forwards 0.2s; opacity:0; font-size:0.85rem; }
.time { animation: fadeSlideUp 0.8s ease forwards 0.5s; opacity:0; font-size:3.5rem; }
.date { animation: fadeSlideUp 0.8s ease forwards 0.6s; opacity:0; margin-bottom: 18px; }
.main-greeting { animation: fadeSlideUp 0.8s ease forwards 0.8s; opacity:0; margin-bottom: 18px; }
.subtext { animation: fadeSlideUp 0.8s ease forwards 1s; opacity:0; }
.status { animation: fadeSlideUp 0.8s ease forwards 1.2s; opacity:0; }

/* Input */
input {
    margin-top:20px;
    padding:12px;
    width:100%;
    border-radius:12px;
    border:none;
}

/* Enter button */
.enter-btn {
  margin-top: 80px;
  padding: 12px 0;
  width: 150px;
  background: rgba(255,255,255,0.3);
  color: white;
  border:none;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
  animation: fadeSlideUp 0.8s ease forwards 1.4s, pulseWave 4s infinite;
  position:relative;
}

/* Button press */
.enter-btn:active {
    transform: scale(0.95);
}

/* Pulse */
.enter-btn::before {
  content:'';
  position:absolute;
  top:50%; left:50%;
  width:150px; height:50px;
  border-radius:30px;
  background: rgba(255,255,255,0.2);
  transform: translate(-50%, -50%);
  animation: pulseWave 4s infinite;
}

@keyframes pulseWave {
    0% { transform: translate(-50%, -50%) scale(1); opacity:0.5; }
    50% { transform: translate(-50%, -50%) scale(1.6); opacity:0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity:0.5; }
}
</style>
</head>


<!-- Loader Overlay (move outside body for persistence) -->
</head>
<body>
<div id="loaderOverlay">
  <div class="spinner"></div>
</div>

<!-- Overlay Reveal -->
<div id="revealOverlay"></div>

<style>
/* Loader overlay */
#loaderOverlay {
  position: fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 99999; /* ensure it's above everything, even during body fade */
}

body.transitioning #loaderOverlay {
  opacity: 1 !important;
  pointer-events: all;
}

/* Active state */
#loaderOverlay.active {
  opacity:1;
  pointer-events:all;
}

/* Spinner */
.spinner {
  width:44px;
  height:44px;
  border:3px solid rgba(255,255,255,0.22);
  border-top:3px solid rgba(255,255,255,0.82);
  border-radius:50%;
  box-shadow: 0 0 18px rgba(255,255,255,0.16);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
/* Overlay Reveal */
#revealOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(120deg, #203a43 0%, #2c5364 100%);
  opacity: 0.92;
  pointer-events: none;
  z-index: 100000;
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.7s cubic-bezier(.4,2,.6,1);
}
#revealOverlay.active {
  transform: scaleY(1);
  pointer-events: all;
}
</style>

<body>

<!-- Floating icons -->
<div class="floating-items">
  <div class="floating-item left" style="top:10%; animation: floatDown 12s linear infinite;">📚</div>
  <div class="floating-item left" style="top:40%; animation: floatUp 14s linear infinite;">✏️</div>
  <div class="floating-item left" style="top:70%; animation: floatDown 13s linear infinite;">📝</div>

  <div class="floating-item right" style="top:15%; animation: floatUp 13s linear infinite;">📖</div>
  <div class="floating-item right" style="top:45%; animation: floatDown 12s linear infinite;">📏</div>
  <div class="floating-item right" style="top:75%; animation: floatUp 15s linear infinite;">📌</div>
</div>

<!-- Setup -->
<div class="container hidden" id="setupScreen">
  <h3>Hey there!</h3>
  <h4> What should we call you?</h4>
  <input id="nameInput" placeholder="Enter your prestigious name">
  <div style="display: flex; flex-direction: column; align-items: center; width: auto; margin-top: 25px;">
    <button class="enter-btn" onclick="saveName()">Continue</button>
  </div>
</div>

<!-- Welcome -->
<div class="container hidden" id="welcomeScreen">
  <div class="app-title">Welcome to Essential Assignment Tracker</div>
  <div class="time" id="time"></div>
  <div class="date" id="date"></div>
  <div class="main-greeting" id="greeting"></div>
  <div class="subtext">Ready to track your assignments?</div>
  <div style="display: flex; justify-content: center;">
    <button class="enter-btn" id="enterBtn">Enter</button>
  </div>
</div>

<!-- Sound -->
<audio id="enterSound" src="ui-tap.wav" preload="auto"></audio>

<script>
// Name logic
const savedName = localStorage.getItem("username");
if(savedName) showWelcome(savedName);
else document.getElementById("setupScreen").classList.remove("hidden");

function saveName(){
  const name = document.getElementById("nameInput").value;
  localStorage.setItem("username", name);
  showWelcome(name);
}

function showWelcome(name){
  document.getElementById("setupScreen").classList.add("hidden");
  document.getElementById("welcomeScreen").classList.remove("hidden");

  function updateTime(){
    const now = new Date();
    document.getElementById("time").innerText =
      now.getHours() + ":" + String(now.getMinutes()).padStart(2,"0");

    document.getElementById("date").innerText =
      now.toDateString();

    let greet = "Welcome";
    if(now.getHours()<12) greet="Good morning";
    else if(now.getHours()<18) greet="Good afternoon";
    else greet="Good evening";

    document.getElementById("greeting").innerText =
      greet + ", " + name;
  }

  setInterval(updateTime,1000);
  updateTime();
}

// Premium Enter
document.getElementById("enterBtn").addEventListener("click", ()=>{
    const sound = document.getElementById("enterSound");
    const loader = document.getElementById("loaderOverlay");
  const enterBtn = document.getElementById("enterBtn");

  const goToDashboard = () => {
    document.body.classList.add("transitioning");
    setTimeout(()=>{
      window.location.href="dashboard.html";
    },1020);
  };

  // Prevent accidental double-clicks from creating multiple navigations.
  enterBtn.disabled = true;

    sound.currentTime = 0;
  const playPromise = sound.play();

    if (navigator.vibrate) navigator.vibrate(30);

    // 🔑 Tell next page we're transitioning
    localStorage.setItem("loadingTransition", "true");

    // Show loader
    loader.classList.add("active");

    let hasNavigated = false;
    const safeNavigate = () => {
      if (hasNavigated) return;
      hasNavigated = true;
      goToDashboard();
    };

    // Primary behavior: transition only after the sound finishes.
    sound.onended = safeNavigate;

    // If audio fails to play, still continue.
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(()=> {
        safeNavigate();
      });
    }

    // Long-stop fallback in case 'ended' never fires.
    setTimeout(()=>{
      safeNavigate();
    },12000);
});
</script>

</body>
</html>
